name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Run flake checks
  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          # Only for bare `nix-*` commands; the flake builds from its own
          # locked nixpkgs (nixos-26.05). Kept in step with it so a stray
          # `<nixpkgs>` reference cannot pull in a different release.
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Run flake check
        run: nix flake check --system x86_64-linux

  # Build packages
  build-packages:
    name: Build packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [nodered, nolongerevil]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v26
        with:
          # Only for bare `nix-*` commands; the flake builds from its own
          # locked nixpkgs (nixos-26.05). Kept in step with it so a stray
          # `<nixpkgs>` reference cannot pull in a different release.
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Set up Cachix
        uses: cachix/cachix-action@v14
        with:
          name: nix-community
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true # Only use cache, don't push

      - name: Build ${{ matrix.package }}
        run: nix build .#${{ matrix.package }} --print-build-logs
